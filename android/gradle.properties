# IPv4 принудительно: если у машины нет маршрута IPv6, Java сперва идёт по
# нему к Maven и зависает до таймаута.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -Djava.net.preferIPv4Stack=true
systemProp.java.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

name: Deploy
run-name: ${{ github.actor }} deploys to sukify.nepalimsya.ru 🚀
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: deploy production
    runs-on: ubuntu-latest
    steps:
      - name: deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          command_timeout: 30m
          script: |
            set -e
            cd /home/deploy/sukify
            echo "🌊 Pull from main..."
            OLD=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            echo "🧱 Build user SPA..."
            docker run --rm -v /home/deploy/sukify/frontend:/app -w /app node:22-alpine sh -c "npm ci --no-audit --no-fund && npm run build"
            echo "🧱 Build admin assets..."
            docker run --rm -v /home/deploy/sukify/backend:/app -w /app node:22-alpine sh -c "npm ci --no-audit --no-fund && npm run build"
            echo "🎛 Build analyzer (BPM, тональность, волна)..."
            docker compose -f docker-compose.prod.yml build analyzer
            # Образ PHP тоже: в нём ffmpeg и bsdtar. Без изменений Dockerfile —
            # всё из кэша за секунды; новый образ подхватит «up -d» ниже. Код к
            # этому моменту уже на диске, поэтому сбой сборки не роняет деплой:
            # останется старый образ (ZIP распакуется, RAR и 7z — нет).
            echo "🐘 Build app image..."
            docker compose -f docker-compose.prod.yml build app \
              || echo "⚠️ App image build failed — keeping the old image (no bsdtar: RAR/7z unpacking unavailable)"
            echo "🎼 Composer install..."
            docker compose -f docker-compose.prod.yml exec -T app composer install --no-dev --optimize-autoloader --no-interaction
            echo "🩻 Apply migrations..."
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
            docker compose -f docker-compose.prod.yml exec -T app php artisan optimize:clear
            docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache
            # Ревизии аудио (md5) трекам без них — по ним приложение докачивает
            # обновлённые файлы. Когда делать нечего, команда сразу выходит.
            echo "🎵 Audio revisions..."
            docker compose -f docker-compose.prod.yml exec -T app php artisan tracks:audio-rev
            echo "🚀 Restart workers..."
            docker compose -f docker-compose.prod.yml restart queue-worker scheduler
            APP_BEFORE=$(docker compose -f docker-compose.prod.yml ps -q app)
            docker compose -f docker-compose.prod.yml up -d
            APP_AFTER=$(docker compose -f docker-compose.prod.yml ps -q app)
            # Nginx перезапускаем, если: (1) новый образ пересоздал app — у
            # контейнера новый IP, а nginx резолвит fastcgi_pass один раз на старте
            # и без рестарта отдаёт 502; (2) поменялся его конфиг — он примонтирован
            # файлом, и после git reset контейнер видит старую версию.
            if [ "$APP_BEFORE" != "$APP_AFTER" ] || ! git diff --quiet "$OLD" HEAD -- docker/nginx/prod.conf; then
              echo "🧭 App container or nginx config changed — restart nginx..."
              docker compose -f docker-compose.prod.yml restart nginx
            fi
            echo "🎉 Completed"

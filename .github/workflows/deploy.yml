name: Deploy
run-name: ${{ github.actor }} deploys to sukify.nepalimsya.ru 🚀
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: deploy production
    runs-on: ubuntu-latest
    steps:
      - name: deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          command_timeout: 30m
          script: |
            set -e
            cd /home/deploy/sukify
            echo "🌊 Pull from main..."
            OLD=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            echo "🧱 Build user SPA..."
            docker run --rm -v /home/deploy/sukify/frontend:/app -w /app node:22-alpine sh -c "npm ci --no-audit --no-fund && npm run build"
            echo "🧱 Build admin assets..."
            docker run --rm -v /home/deploy/sukify/backend:/app -w /app node:22-alpine sh -c "npm ci --no-audit --no-fund && npm run build"
            echo "🎛 Build analyzer (BPM, тональность, волна)..."
            docker compose -f docker-compose.prod.yml build analyzer
            echo "🎼 Composer install..."
            docker compose -f docker-compose.prod.yml exec -T app composer install --no-dev --optimize-autoloader --no-interaction
            echo "🩻 Apply migrations..."
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
            docker compose -f docker-compose.prod.yml exec -T app php artisan optimize:clear
            docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache
            # Ревизии аудио (md5) трекам без них — по ним приложение докачивает
            # обновлённые файлы. Когда делать нечего, команда сразу выходит.
            echo "🎵 Audio revisions..."
            docker compose -f docker-compose.prod.yml exec -T app php artisan tracks:audio-rev
            echo "🚀 Restart workers..."
            docker compose -f docker-compose.prod.yml restart queue-worker scheduler
            docker compose -f docker-compose.prod.yml up -d
            # Конфиг nginx примонтирован файлом: после git reset контейнер видит
            # старую версию, пока его не перезапустить.
            if ! git diff --quiet "$OLD" HEAD -- docker/nginx/prod.conf; then
              echo "🧭 Nginx config changed — restart nginx..."
              docker compose -f docker-compose.prod.yml restart nginx
            fi
            echo "🎉 Completed"
